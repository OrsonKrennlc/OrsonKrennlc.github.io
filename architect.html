<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jerry Shen 的建筑设计项目地图、项目列表与完整作品档案。"
        data-i18n-content="meta.arch.description">
    <title data-i18n="meta.arch.title">Jerry Shen - 建筑作品</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Caveat:wght@700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Serif+Tibetan:wght@200;400&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/architect.css">
</head>

<body>

    <header class="site-header">
        <div class="logo">Jerry Shen</div>
        <div class="header-controls">
            <nav class="main-nav" aria-label="主导航" data-i18n-aria-label="nav.main">
                <a href="index.html#home" data-i18n="nav.home">主页</a>
                <a href="architect.html" class="active" aria-current="page" data-i18n="nav.architecture">建筑</a>
                <a href="index.html#projects" data-i18n="nav.uiux">交互</a>
                <a href="index.html#projects" data-i18n="nav.photography">摄影</a>
                <a href="tools.html" data-i18n="nav.tools">小工具集</a>
            </nav>
            <div class="language-switcher" role="group" aria-label="语言切换"
                data-i18n-aria-label="language.switcher">
                <button type="button" data-locale="zh" aria-pressed="true" aria-label="切换为中文"
                    data-i18n-aria-label="language.zh">中</button>
                <span aria-hidden="true">/</span>
                <button type="button" data-locale="en" aria-pressed="false" aria-label="切换为英文"
                    data-i18n-aria-label="language.en">EN</button>
            </div>
        </div>
    </header>

    <main class="main-wrapper arch-main">
        
        <!-- Map Section -->
        <section class="map-section">
            <h1 class="map-title"><strong data-i18n="map.title">项目分布</strong></h1>
            <div class="map-container">
                <div id="project-map" role="region" aria-label="建筑项目分布地图"
                    data-i18n-aria-label="map.region"></div>
            </div>
            
            <div class="scroll-arrow-arch">
                <img src="assets/images/vector.svg" width="51" height="17" alt="">
            </div>
        </section>

        <!-- Projects Section -->
        <section class="arch-projects-section" id="projects-container" aria-label="建筑项目列表" aria-live="polite"
            data-i18n-aria-label="projects.list">
            <!-- Dynamic project cards will be inserted here by JS -->
            <noscript data-i18n="projects.noscript">请启用 JavaScript 以浏览建筑项目。</noscript>
        </section>

    </main>

    <!-- Modal for Project Details -->
    <div class="arch-modal-overlay" id="arch-modal-overlay" aria-hidden="true">
        <div class="arch-modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"
            aria-describedby="modal-desc" tabindex="-1">
            <button class="modal-close-btn" id="modal-close-btn" type="button" aria-label="关闭项目详情"
                data-i18n-aria-label="modal.close"></button>
            
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title"></h2>
                <p class="modal-subtitle" id="modal-subtitle"></p>
            </div>
            
            <div class="modal-gallery-container">
                <div class="modal-gallery" id="modal-gallery" aria-live="polite">
                    <!-- Images will be inserted here -->
                </div>
                <div class="gallery-controls">
                    <div class="gallery-dots" id="gallery-dots"></div>
                    <div class="gallery-arrows">
                        <button id="gallery-prev" type="button" aria-label="上一张项目图片"
                            data-i18n-aria-label="gallery.previous">&lt;</button>
                        <button id="gallery-next" type="button" aria-label="下一张项目图片"
                            data-i18n-aria-label="gallery.next">&gt;</button>
                    </div>
                </div>
            </div>
            
            <div class="modal-body">
                <div class="arch-card-grid modal-info-grid" id="modal-info-grid">
                    <!-- Info items -->
                </div>
                <div class="modal-desc" id="modal-desc">
                    <!-- Description -->
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-left" data-i18n="footer.made">Jerry 用 ❤️ 制作</div>
        <div class="footer-center" data-i18n="footer.copyright">© 2026 Orson Krennic。保留所有权利。</div>
        <div class="footer-right" data-i18n="footer.powered">由 Chimi 的爱💗 与 GitHub Pages 驱动</div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="assets/arch/projectsData.js" defer></script>
    <script src="js/architect.js" defer></script>
</body>

</html>
