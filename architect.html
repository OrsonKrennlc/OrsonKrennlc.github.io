<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Junyang Shen 的建筑设计项目地图、项目列表与完整作品档案。"
        data-i18n-content="meta.arch.description">
    <title data-i18n="meta.arch.title">Junyang Shen - 建筑作品</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Caveat:wght@700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Serif+Tibetan:wght@200;400&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/architect.css">
</head>

<body>

    <header class="site-header">
        <div class="logo">Junyang Shen</div>
        <button class="mobile-menu-toggle" type="button" aria-expanded="false"
            aria-controls="site-header-panel" aria-label="打开导航菜单">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </button>
        <div class="header-controls" id="site-header-panel">
            <nav class="main-nav" aria-label="主导航" data-i18n-aria-label="nav.main">
                <a href="index.html#home" data-i18n="nav.home">主页</a>
                <a href="architect.html" class="active" aria-current="page" data-i18n="nav.architecture">建筑</a>
                <a href="index.html#projects" data-i18n="nav.uiux">交互</a>
                <a href="index.html#projects" data-i18n="nav.photography">摄影</a>
                <a href="tools.html" data-i18n="nav.tools">小工具集</a>
            </nav>
            <div class="language-switcher" role="group" aria-label="语言切换"
                data-i18n-aria-label="language.switcher">
                <button type="button" data-locale="zh" aria-pressed="true" aria-label="切换为中文"
                    data-i18n-aria-label="language.zh">中</button>
                <span aria-hidden="true">/</span>
                <button type="button" data-locale="en" aria-pressed="false" aria-label="切换为英文"
                    data-i18n-aria-label="language.en">EN</button>
            </div>
        </div>
    </header>

    <main class="main-wrapper arch-main">
        
        <!-- Architecture Overview and Map -->
        <section class="arch-overview-section">
            <div class="arch-overview-layout">
                <div class="arch-overview-copy">
                    <p class="arch-overview-eyebrow" data-i18n="overview.eyebrow">建筑作品选集</p>
                    <h1 class="arch-overview-title" data-i18n="projects.title">建筑项目</h1>
                    <p class="arch-overview-intro" data-i18n="overview.intro">
                        以成都为主要观察场域，收录公共建筑、居住、酒店与文化更新等类型的设计实践。
                    </p>
                    <div class="arch-quick-nav" id="arch-quick-nav">
                        <button class="arch-quick-toggle" id="arch-quick-toggle" type="button"
                            aria-expanded="false" aria-controls="arch-quick-list">
                            <span data-i18n="overview.quickNav">快速浏览项目</span>
                            <span class="arch-quick-count" id="arch-project-count">04</span>
                            <span class="arch-quick-icon" aria-hidden="true"></span>
                        </button>
                        <div class="arch-quick-list-shell">
                            <div class="arch-quick-list" id="arch-quick-list" aria-label="建筑项目快捷列表"
                                data-i18n-aria-label="overview.quickNavLabel"></div>
                        </div>
                    </div>
                </div>

                <div class="arch-map-panel">
                    <div class="arch-map-heading">
                        <h2 class="map-title" data-i18n="map.title">项目分布</h2>
                    </div>
                    <div class="map-container">
                        <div id="project-map" role="region" aria-label="建筑项目分布地图"
                            data-i18n-aria-label="map.region"></div>
                    </div>
                </div>
            </div>
            
            <a class="scroll-arrow-arch" href="#projects-container" aria-label="浏览建筑项目"
                data-i18n-aria-label="projects.scroll">
                <img src="assets/images/vector.svg" width="51" height="17" alt="">
            </a>
        </section>

        <!-- Projects Section -->
        <section class="arch-projects-section" id="projects-container">
            <h2 class="arch-projects-title" data-i18n="projects.indexTitle">项目索引</h2>
            <div class="arch-project-list" id="projects-list" aria-label="建筑项目列表" aria-live="polite"
                data-i18n-aria-label="projects.list">
                <!-- Dynamic project cards will be inserted here by JS -->
                <noscript data-i18n="projects.noscript">请启用 JavaScript 以浏览建筑项目。</noscript>
            </div>
        </section>

    </main>

    <!-- Modal for Project Details -->
    <div class="arch-modal-overlay" id="arch-modal-overlay" aria-hidden="true">
        <div class="arch-modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"
            aria-describedby="modal-desc" tabindex="-1">
            <button class="modal-close-btn" id="modal-close-btn" type="button" aria-label="关闭项目详情"
                data-i18n-aria-label="modal.close"></button>
            
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title"></h2>
                <p class="modal-subtitle" id="modal-subtitle"></p>
            </div>
            
            <div class="modal-gallery-container">
                <div class="modal-gallery" id="modal-gallery" aria-live="polite">
                    <!-- Images will be inserted here -->
                </div>
                <div class="gallery-controls">
                    <div class="gallery-progress">
                        <span class="gallery-counter" id="gallery-counter" aria-hidden="true">01 / 01</span>
                        <div class="gallery-dots" id="gallery-dots"></div>
                    </div>
                    <div class="gallery-arrows">
                        <button id="gallery-prev" type="button" aria-label="上一张项目图片"
                            data-i18n-aria-label="gallery.previous">←</button>
                        <button id="gallery-next" type="button" aria-label="下一张项目图片"
                            data-i18n-aria-label="gallery.next">→</button>
                    </div>
                </div>
            </div>
            
            <div class="modal-body">
                <div class="arch-card-grid modal-info-grid" id="modal-info-grid">
                    <!-- Info items -->
                </div>
                <div class="modal-desc" id="modal-desc">
                    <!-- Description -->
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-left" data-i18n="footer.made">Junyang 用 ❤️ 制作</div>
        <div class="footer-center" data-i18n="footer.copyright">© 2026 Orson Krennic。保留所有权利。</div>
        <div class="footer-right" data-i18n="footer.powered">由 Chimi 的爱💗 与 GitHub Pages 驱动</div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/site-header.js" defer></script>
    <script src="assets/arch/projectsData.js" defer></script>
    <script src="js/architect.js?v=20260806-2" defer></script>
</body>

</html>
